apiVersion: v1
kind: Pod
spec:
  serviceAccountName: jenkins-ci
  securityContext:
    runAsNonRoot: true
  containers:
    - name: maven
      image: maven:3.9-eclipse-temurin-21
      command: [cat]
      tty: true
    - name: builder
      image: moby/buildkit:rootless
      command: [cat]
      tty: true
    - name: helm
      image: alpine/helm:3.16.1
      command: [cat]
      tty: true
    - name: kubectl-helm-aws
      # Publish and maintain this image internally with kubectl, Helm, and AWS CLI installed.
      image: registry.example.com/ci/kubectl-helm-aws:1.30-3.16-2
      command: [cat]
      tty: true
    - name: skopeo
      image: quay.io/skopeo/stable:v1.15.2
      command: [cat]
      tty: true
    - name: trivy
      image: aquasec/trivy:0.56.2
      command: [cat]
      tty: true
